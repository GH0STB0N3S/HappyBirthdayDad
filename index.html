(function(){

/* ---------- single text constant ---------- */
const BIRTHDAY_TEXT = 'HAPPY BIRTHDAY DAD';

const W=240,H=216,HZ=102,SEG=200,ROADW=800,CAMH=900,CAMD=0.84,PZ=CAMH*CAMD,DRAW=150,MAXSP=11000,TOPKMH=280,PAD=320;

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- palettes ---------- */
const PAL=[
 {top:'#2f7bff',mid:'#79c4ff',bot:'#d9f3ff',sun:'#fff3a0',sunR:15,stripes:false,far:'#86a9e0',near:'#5a86c4',sil:'#2e5a91',sand:['#e8c277','#dcb264'],road:['#767688','#6c6c7e'],rum:['#d92b2b','#f2f2f2'],lane:'#f4f4e8',cloud:'#ffffff',stars:false,moon:false},
 {top:'#2a1670',mid:'#e8478a',bot:'#ffb04a',sun:'#ffe45c',sunR:21,stripes:true,far:'#9a3f93',near:'#5e2778',sil:'#2c1148',sand:['#d08b50','#c27d45'],road:['#625672','#594e69'],rum:['#d92b2b','#f2f2f2'],lane:'#f4e8e0',cloud:'#f58aa8',stars:false,moon:false},
 {top:'#03030f',mid:'#101040',bot:'#2c2c78',sun:'#e8ecff',sunR:9,stripes:false,far:'#1f2d66',near:'#131e48',sil:'#080d26',sand:['#6d5a74','#62506a'],road:['#3b3b55','#34344d'],rum:['#c02424','#d8d8e4'],lane:'#e0e0f0',cloud:'#33337a',stars:true,moon:true},
 {top:'#6a4fd8',mid:'#f08fc0',bot:'#ffe0a8',sun:'#fff8e0',sunR:12,stripes:false,far:'#b58cd0',near:'#7f63a6',sil:'#473a78',sand:['#ecce92','#e0c07f'],road:['#7c7290','#726888'],rum:['#d92b2b','#f2f2f2'],lane:'#fff',cloud:'#ffe6f2',stars:false,moon:false}
];
function mountainTile(col,amp,f1,f2,off,base,silCol,palms){
  const m=mk(W,60),c=m[0],x=m[1];x.fillStyle=col;
  for(let i=0;i<W;i++){
    const a=1-Math.abs(Math.sin(Math.PI*f1*(i+off)/W));
    const b=0.5+0.5*Math.sin(2*Math.PI*f2*(i+off)/W);

}
function buildPal(p,idx){

  for(let y=0;y<HZ+6;y+=3){const t=Math.min(1,y/HZ);sx.fillStyle=t<.5?mix(p.top,p.mid,t*2):mix(p.mid,p.bot,(t-.5)*2);sx.fillRect(0,y,W,3);}

  const cx=168,cy=HZ-12,r=p.sunR;sx.fillStyle=p.sun;

for(let i=0;i<PAL.length;i++)buildPal(PAL[i],i);

/* ---------- sprites ---------- */
function buildPalm(){
  const m=mk(32,48),c=m[0],x=m[1];
  for(let y=47;y>=14;y--){const bend=Math.round(Math.sin((47-y)/11)*2);x.fillStyle=((y>>2)&1)?'#8b5a2b':'#6e4521';x.fillRect(14+bend,y,3,1);}

}
function buildRock(){
  const m=mk(24,14),c=m[0],x=m[1];const ws=[6,10,14,18,20,22,24,24,24,24,22];

function buildSign(v){

let ac=null,master=null,engOsc=null,engGain=null,noiseBuf=null,muted=false;
function ensureAudio(){
  if(ac){if(ac.state==='suspended'){try{ac.resume();}catch(e){}}return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    ac=new AC();
    master=ac.createGain();master.gain.value=muted?0:0.5;master.connect(ac.destination);
    engOsc=ac.createOscillator();engOsc.type='sawtooth';engOsc.frequency.value=60;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    engGain=ac.createGain();engGain.gain.value=0;
    engOsc.connect(lp);lp.connect(engGain);engGain.connect(master);engOsc.start();
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;engGain=null;engOsc=null;}
}
function beep(f,d,type,v,delay,slide){
  if(!ac||muted)return;
  try{
    const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    g.gain.setValueAtTime(v||0.1,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.03);
  }catch(e){}
}
function noise(d,v){
  if(!ac||muted||!noiseBuf)return;
  try{
    const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=900;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(ac.currentTime+d+0.02);
  }catch(e){}
}

/* ---------- physics ---------- */
function physics(dt,gas,brake,steer){
  const pct=speed/MAXSP;
  const idx=Math.min(Math.floor((pos+PZ)/SEG),segs.length-1);
  const seg=segs[idx];
  const off=Math.abs(playerX)>1.08;
  const lim=off?MAXSP*0.22:MAXSP;
  if(spinT>0){gas=false;steer=0;brake=false;spinT-=dt;speed-=MAXSP/3*dt;}
  if(gas)speed+=MAXSP/6*(1.15-0.9*pct)*dt;else speed-=MAXSP/10*dt;
  if(brake)speed-=MAXSP/2.2*dt;
  if(off&&speed>lim){speed-=MAXSP/1.1*dt;if(speed<lim)speed=lim;shake=Math.max(shake,0.3);}
  speed=clamp(speed,0,MAXSP);
  if(!isFinite(speed))speed=0;
  const sp=speed/MAXSP,dx=dt*2.2*sp;
  playerX+=dx*steer;
  playerX-=dx*sp*seg.c*0.32;
  playerX=clamp(playerX,-2.6,2.6);
  if(!isFinite(playerX))playerX=0;
  tilt+=(steer*(sp>0.02?1:0)-tilt)*Math.min(1,dt*10);
  pos+=speed*dt;
  const lim2=(FIN+100)*SEG;
  if(pos>lim2){pos=lim2;speed=0;}
  bgX+=seg.c*sp*dt*14;
}

function step(dt){
  t+=dt;
  const L=kLeft(),R=kRight(),gas=kGas(),br=kBrake();
  const steer=(R?1:0)-(L?1:0);
  if(bannerT>0)bannerT-=dt;
  if(muteFlash>0)muteFlash-=dt;
  if(invuln>0)invuln-=dt;
  shake=Math.max(0,shake-dt*1.5);
  updParticles(dt);
  if(state==='title'){
    demoPos=(demoPos+5200*dt)%(700*SEG);pos=demoPos;speed=5200;
    playerX=Math.sin(t*0.7)*0.4;
    tilt+=(Math.cos(t*0.7)*0.5-tilt)*Math.min(1,dt*6);
    const sg=segs[Math.floor((pos+PZ)/SEG)];
    bgX+=sg.c*0.47*dt*14;gasing=true;braking=false;
    return;
  }
  if(state==='paused')return;
  if(state==='countdown'){
    cdT+=dt;speed=0;gasing=false;braking=false;
    const n=3-Math.floor(cdT);
    if(cdT>=3){state='race';banner('GO!','',0.9);beep(880,0.5,'square',0.12);}
    else if(n!==lastCd){lastCd=n;beep(440,0.18,'square',0.1);}
    return;
  }
  const racing=state==='race';
  let steerIn=0,gIn=false,bIn=false;
  if(racing){steerIn=steer;gIn=gas;bIn=br;}
  else if(state==='finish'){steerIn=playerX>0.05?-0.5:(playerX<-0.05?0.5:0);bIn=finT>1.5;}
  else{bIn=true;}
  physics(dt,gIn,bIn,steerIn);
  gasing=racing&&gas;braking=(bIn&&speed>0)||spinT>0;
  if(racing){
    timeLeft-=dt;
    const kmh=speed/MAXSP*TOPKMH;
    distKm+=kmh*dt/3600;
    score+=speed*dt/SEG*6;
    const pz=pos+PZ,lim=(FIN+60)*SEG;
    for(let i=0;i<cars.length;i++){
      const c=cars[i];
      c.z=Math.min(lim,c.z+c.sp*dt);
      c.seg=Math.floor(c.z/SEG);
      const rel=c.z-pz,hx=Math.abs(playerX-c.o);
      if(invuln<=0&&hx<0.32&&((rel>-110&&rel<110)||(c.rel>=110&&rel<=-110)||(c.rel<=-110&&rel>=110))){crash(c);}
      else if(c.rel>0&&rel<=0&&hx<1.2){score+=250;beep(1200,0.06,'square',0.06);}
      c.rel=rel;
    }
    const idx=Math.floor((pos+PZ)/SEG);
    if(nextCP<3&&idx>=CPS[nextCP]){
      timeLeft+=20;score+=1000;stage=Math.min(3,nextCP+1);nextCP++;
      banner('CHECKPOINT','+20 SEC',2.2);confetti(70);arpeggio();
    }
    if(!hiFired&&best>0&&score>best){hiFired=true;banner('NEW HI-SCORE!','',2);confetti(50);beep(1320,0.2,'square',0.09);}
    if(idx>=FIN){recordBest();finishRace();}
    else if(timeLeft<=0){recordBest();endTime();}
    if(!isFinite(timeLeft))timeLeft=0;
  }else if(state==='finish'){
    finT+=dt;finBurstT-=dt;
    if(finBurstT<=0){finBurstT=0.3;burst(30+Math.random()*180,28+Math.random()*80,34,-1);beep(300+Math.random()*500,0.12,'sawtooth',0.04,0,90);}
    if(Math.random()<dt*10)confetti(2);
    if(finT>5){state='over';overT=0;}
  }else if(state==='over'){
    overT+=dt;
  }
}

/* ---------- rendering ---------- */
function poly(x1,y1,x2,y2,x3,y3,x4,y4){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();}
function spr(c,x,y,dw,clipY){
  if(dw<1.5)return;
  const dh=dw*c.height/c.width;
  const dx=Math.round(x-dw/2),dy=Math.round(y-dh);
  if(dx>W||dx+dw<0)return;
  const ch=clipY<H?Math.max(0,y-clipY):0;
  if(ch>=dh)return;
  const sh=c.height*(1-ch/dh);
  ctx.drawImage(c,0,0,c.width,sh,dx,dy,Math.round(dw),Math.round(dh-ch));
}
function drawWorld(){
  const pal=PAL[stage];
  ctx.drawImage(pal.sky,0,0);
  let o=Math.round(mod(bgX*0.3,W));ctx.drawImage(pal.cloudT,-o,0);ctx.drawImage(pal.cloudT,W-o,0);
  o=Math.round(mod(bgX*0.6,W));ctx.drawImage(pal.farT,-o,HZ+3-60);ctx.drawImage(pal.farT,W-o,HZ+3-60);
  o=Math.round(mod(bgX,W));ctx.drawImage(pal.nearT,-o,HZ+3-60);ctx.drawImage(pal.nearT,W-o,HZ+3-60);
  ctx.fillStyle=pal.sand[0];ctx.fillRect(0,HZ+3,W,H-HZ-3);

  const baseIdx=Math.floor(pos/SEG),base=segs[baseIdx];
  const bp=(pos%SEG)/SEG;
  const ps=segs[Math.min(segs.length-1,Math.floor((pos+PZ)/SEG))],pp=((pos+PZ)%SEG)/SEG;
  const playerY=ps.y1+(ps.y2-ps.y1)*pp;
  const camY=playerY+CAMH,camX=playerX*ROADW;
  let x=0,dx=-base.c*bp,maxy=H;
  const hw=W/2,hh=H/2;
  for(let n=0;n<DRAW;n++){
    const seg=segs[baseIdx+n];if(!seg)break;
    const cz1=seg.i*SEG-pos;
    seg.cz=cz1;seg.clip=maxy;
    const x1=x,x2=x+dx;
    x+=dx;dx+=seg.c;
    if(cz1<=CAMD)continue;
    const sc1=CAMD/cz1,sc2=CAMD/(cz1+SEG);
    seg.sc1=sc1;seg.sc2=sc2;
    seg.sx1=Math.round(hw+sc1*(x1-camX)*hw);
    seg.sx2=Math.round(hw+sc2*(x2-camX)*hw);
    seg.sy1=Math.round(HZ-sc1*(seg.y1-camY)*hh);
    seg.sy2=Math.round(HZ-sc2*(seg.y2-camY)*hh);
    const y1=seg.sy1,y2=seg.sy2;
    if(y2>=y1||y2>=maxy)continue;
    const w1=Math.round(sc1*ROADW*hw),w2=Math.round(sc2*ROADW*hw);
    const sx1=seg.sx1,sx2=seg.sx2,b=seg.band;
    ctx.fillStyle=pal.sand[b];ctx.fillRect(0,y2,W,y1-y2);
    const r1=Math.round(w1/6),r2=Math.round(w2/6);
    ctx.fillStyle=pal.rum[b];
    poly(sx1-w1-r1,y1,sx1-w1,y1,sx2-w2,y2,sx2-w2-r2,y2);
    poly(sx1+w1+r1,y1,sx1+w1,y1,sx2+w2,y2,sx2+w2+r2,y2);
    if(seg.i===FIN||seg.i===FIN+1)ctx.fillStyle=(seg.i&1)?'#111':'#fff';
    else ctx.fillStyle=pal.road[b];
    poly(sx1-w1,y1,sx1+w1,y1,sx2+w2,y2,sx2-w2,y2);
    if(b===0&&w2>=2){
      const l1=Math.max(1,Math.round(w1/28)),l2=Math.max(1,Math.round(w2/28));
      ctx.fillStyle=pal.lane;poly(sx1-l1,y1,sx1+l1,y1,sx2+l2,y2,sx2-l2,y2);
    }
    maxy=y1;
  }
  for(let n=DRAW-1;n>=0;n--){
    const seg=segs[baseIdx+n];if(!seg)continue;
    if(seg.cz<=CAMD)continue;
    if(seg.spr){
      for(let k=0;k<seg.spr.length;k++){
        const q=seg.spr[k];
        spr(q.s.c,seg.sx1+seg.sc1*q.o*ROADW*hw,seg.sy1,q.s.w*seg.sc1*hw,seg.clip);
      }
    }
    for(let i=0;i<cars.length;i++){
      const c=cars[i];
      if(c.seg!==seg.i)continue;
      const pct=(c.z%SEG)/SEG;
      const sc=seg.sc1+(seg.sc2-seg.sc1)*pct;
      const sx=seg.sx1+(seg.sx2-seg.sx1)*pct+sc*c.o*ROADW*hw;
      const sy=seg.sy1+(seg.sy2-seg.sy1)*pct;
      const cs=CARSP[c.type];
      spr(cs.c,sx,sy,cs.w*sc*hw,seg.clip);
    }
  }
}
function drawPlayer(){
  let ti=tilt<-0.35?0:(tilt>0.35?2:1);
  let px=120-18,py=190;
  if(spinT>0){const f=((spinT*16)|0)&1;ti=f?0:2;px+=f?-3:3;py-=(Math.abs(Math.sin(spinT*12))*4)|0;}
  if(Math.abs(playerX)>1.08&&speed>200)py+=((t*30)|0)&1;
  const fr=((pos/80)|0)&1;
  ctx.globalAlpha=0.35;ctx.fillStyle='#000';ctx.fillRect(px+3,py+20,30,3);ctx.globalAlpha=1;
  ctx.drawImage(CARF[braking?1:0][ti][fr],px,py);
  if(gasing&&speed>100){
    const k=((t*40)|0)%3;
    ctx.fillStyle=k===0?'#ffd23a':(k===1?'#ff8a1e':'#fff2a0');
    ctx.fillRect(px+15,py+22,2,1+k);ctx.fillRect(px+19,py+22,2,1+((k+1)%3));
  }
}
const SLN=18,SLA=new Float32Array(SLN),SLP=new Float32Array(SLN);
for(let i=0;i<SLN;i++){const side=i&1?1:-1,spread=(Math.random()-0.2)*0.9;SLA[i]=side>0?spread:Math.PI-spread;SLP[i]=Math.random();}
function drawSpeedLines(){
  const kmh=speed/MAXSP*TOPKMH;
  if(kmh<180)return;
  ctx.globalAlpha=Math.min(0.5,(kmh-180)/200);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<SLN;i++){
    const u=(SLP[i]+t*(1.2+speed/MAXSP))%1,r1=30+u*u*150,r2=r1+6+u*18;
    const c=Math.cos(SLA[i]),s=Math.sin(SLA[i]);
    ctx.moveTo(120+c*r1,HZ+14+s*r1*0.6);ctx.lineTo(120+c*r2,HZ+14+s*r2*0.6);
  }
  ctx.stroke();ctx.globalAlpha=1;
}
function txt(s,x,y,size,col,al,sh){
  setFont(size);ctx.textAlign=al||'center';ctx.textBaseline='middle';
  if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
/* HUD cached on its own canvas, redrawn only when values change */
const hm=mk(W,24),hudC=hm[0],hx=hm[1];
let lT=-1,lK=-1,lS=-1,lG='',lM=-1,lB=-1;
function padS(n,len){let s=String(n);while(s.length<len)s='0'+s;return s;}
function drawHud(tm,kmh,sc,gear,mu){
  hx.fillStyle='#14102a';hx.fillRect(0,0,W,24);hx.fillStyle='#4a3f7a';hx.fillRect(0,23,W,1);
  hx.textBaseline='top';hx.textAlign='left';
  hx.font='bold 7px monospace';hx.fillStyle='#9fb0ff';
  hx.fillText('TIME',6,2);hx.fillText('KM/H',52,2);hx.fillText('SCORE',104,2);
  hx.font='bold 12px monospace';
  hx.fillStyle=tm<=10?'#ff5050':'#ffe14a';hx.fillText(String(tm),6,10);
  hx.fillStyle='#ffffff';hx.fillText(String(kmh),52,10);
  hx.fillStyle='#7dff9a';hx.fillText(padS(sc,6),104,10);
  hx.fillStyle='#000';hx.fillRect(196,3,40,18);hx.strokeStyle='#ffd23a';hx.strokeRect(196.5,3.5,39,17);
  hx.font='bold 6px monospace';hx.fillStyle='#9fb0ff';hx.fillText('GEAR',199,6);
  hx.font='bold 12px monospace';hx.fillStyle=gear==='N'?'#ff8a8a':'#fff';hx.fillText(gear,222,6);
  if(mu){hx.font='bold 7px monospace';hx.fillStyle='#ff5050';hx.fillText('MUTE',156,2);}
}
function updateHud(){
  const tm=Math.max(0,Math.ceil(timeLeft)),kmh=Math.round(speed/MAXSP*TOPKMH),sc=Math.floor(score),g=gearNum(),gs=g===0?'N':String(g),mu=muted?1:0;
  if(tm!==lT||kmh!==lK||sc!==lS||gs!==lG||mu!==lM){lT=tm;lK=kmh;lS=sc;lG=gs;lM=mu;drawHud(tm,kmh,sc,gs,muted);}
  ctx.drawImage(hudC,0,0);
}
function drawBanner(){
  if(bannerT<=0)return;
  const fl=((t*8)|0)&1;
  ctx.globalAlpha=0.6;ctx.fillStyle='#000';ctx.fillRect(0,46,W,bannerB?38:26);ctx.globalAlpha=1;
  txt(bannerA,120,58,fitSize(bannerA.length,220,18),fl?'#ffe14a':'#ffffff','center','#a00');
  if(bannerB)txt(bannerB,120,76,12,'#7dff9a','center','#041');
}
function dim(a){ctx.globalAlpha=a;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
function drawTitle(){
  ctx.drawImage(TITLE,0,20+Math.round(Math.sin(t*2)*2));
  ctx.globalAlpha=0.5;ctx.fillStyle='#000';ctx.fillRect(0,110,W,22);ctx.globalAlpha=1;
  const cols=['#ffe14a','#ff6bd6','#3bd6ff','#7dff6b'];
  txt(BIRTHDAY_TEXT,120,121,fitSize(BIRTHDAY_TEXT.length,220,15),cols[((t*5)|0)%4],'center','#000');
  if(((t*2)|0)%2===0)txt('PRESS START',120,168,12,'#ffffff','center','#000');
  txt('START or A',120,184,8,'#cfd6ff','center','#000');
  if(best>0)txt('BEST '+padS(Math.floor(best),6),120,198,8,'#ffe14a','center','#000');
}
function drawResult(){
  dim(0.45);
  ctx.fillStyle='#14102a';ctx.fillRect(25,38,190,138);
  ctx.strokeStyle='#ffd23a';ctx.lineWidth=1;ctx.strokeRect(25.5,38.5,189,137);
  ctx.strokeStyle='#ff6bd6';ctx.strokeRect(29.5,42.5,181,129);
  if(finishedOK){
    txt('FINISH!',120,58,20,'#ffe14a','center','#a00');
    txt(BIRTHDAY_TEXT,120,76,fitSize(BIRTHDAY_TEXT.length,170,10),((t*5)|0)&1?'#ff6bd6':'#3bd6ff','center','#000');
  }else{
    txt('TIME UP!',120,60,20,'#ff5050','center','#400');
  }
  txt('SCORE '+padS(Math.floor(score),6),120,100,11,'#ffffff','center','#000');
  txt('DIST  '+distKm.toFixed(2)+' KM',120,118,10,'#9fb0ff','center','#000');
  txt('BEST  '+padS(Math.floor(best),6),120,134,10,'#7dff9a','center','#000');
  if(score>=best&&score>0)txt('NEW SESSION BEST!',120,150,8,'#ffe14a','center','#000');
  if(overT>0.5&&((t*2)|0)%2===0)txt('PRESS START',120,164,10,'#ffffff','center','#000');
}
function drawFinishText(){
  const p=1+Math.sin(finT*6)*0.06;
  const s1=Math.round(26*p),s2=Math.round(fitSize(BD2.length,220,22)*p);
  const cols=['#ffe14a','#ff6bd6','#3bd6ff','#7dff6b'];
  txt(BD1,120,56,s1,cols[((t*6)|0)%4],'center','#000');
  txt(BD2,120,84,s2,cols[((t*6+2)|0)%4],'center','#000');
}
function render(){
  let sx=0,sy=0;
  if(shake>0){sx=Math.round((Math.random()-0.5)*2*shake*5);sy=Math.round((Math.random()-0.5)*2*shake*4);}
  ctx.setTransform(1,0,0,1,sx,sy);
  drawWorld();
  drawPlayer();
  drawSpeedLines();
  drawParticles();
  ctx.setTransform(1,0,0,1,0,0);
  updateHud();
  if(state==='title')drawTitle();
  else if(state==='countdown'){
    const n=Math.max(1,3-Math.floor(cdT));
    txt(String(n),120,86,64,'#ffe14a','center','#a00');
  }
  else if(state==='paused'){dim(0.5);txt('PAUSED',120,92,20,'#ffffff','center','#000');txt('PRESS START',120,120,10,'#ffe14a','center','#000');}
  else if(state==='finish'){drawFinishText();}
  else if(state==='over'){drawResult();}
  drawBanner();
  if(muteFlash>0&&state!=='title')txt(muted?'SOUND OFF':'SOUND ON',120,34,8,'#fff','center','#000');
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(!(dt>0))dt=0.016;
  if(dt>1/30)dt=1/30;
  step(dt);
  syncVisuals();
  audioUpdate();
  render();
}

/* ---------- responsive shell ---------- */
const stageEl=document.getElementById('stage');
function fit(){
  const sw=stageEl.offsetWidth+16,sh=stageEl.offsetHeight+16;
  const vw=window.innerWidth,vh=window.innerHeight;
  const root=document.documentElement,b=document.body;
  if(window.__lat===undefined||Math.abs(vw-window.__latW)>40){window.__latW=vw;window.__lat=(vh<500&&vh<vw*1.25);}
  const tall=window.__lat;
  root.classList.toggle('tall',tall);
  if(tall){
    const s=Math.max(0.1,Math.min(vw/sw,4));
    const H=Math.ceil(sh*s);
    root.style.height='auto';root.style.overflowY='auto';
    b.style.position='relative';b.style.height=H+'px';b.style.overflow='hidden';
    stageEl.style.top=(H/2)+'px';
    stageEl.style.transform='translate(-50%,-50%) scale('+s+')';
    document.__tallMode=true;
  }else{
    const s=Math.max(0.1,Math.min(vw/sw,vh/sh));
    root.style.height='';root.style.overflowY='';
    b.style.position='';b.style.height='';b.style.overflow='';
    stageEl.style.top='';
    stageEl.style.transform='translate(-50%,-50%) scale('+s+')';
    document.__tallMode=false;
  }
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
fit();
resetGame();
state='title';
requestAnimationFrame(frame);
})();
